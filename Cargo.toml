[package]
name = "memtop"
version = "0.1.0"
edition = "2021"
description = "ceph-memtop: where is this Ceph node's memory? Node and per-daemon accounting that adds up."
license = "MIT"

[[bin]]
name = "ceph-memtop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
signal-hook = "0.3"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
